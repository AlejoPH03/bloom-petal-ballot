schema = "bloom.petal.package.v1"
name = "ballot"

[consent]
summary = "Read Snapshot governance proposals and cast owner-approved votes"

# Package ceiling = union of what routes import. Only the temporary Step 1
# route hello-sign.json imports anything: bloom:sign (sign_payload),
# bloom:store (its attempt record) and bloom:vfs.read (the account's
# address.evm). Directory routes import nothing.
[caps]
allowed = ["bloom:sign", "bloom:store", "bloom:vfs.read"]

[sign]
allowed_intents = ["snapshot.vote"]

# Public attempt records only. No secret namespace: no secret is stored and
# signature bytes are never persisted.
[store]
namespaces = ["state"]
